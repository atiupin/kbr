# DOSBox-X config for King's Bounty translation project
# Launch with:  /Applications/dosbox-x.app/Contents/MacOS/dosbox-x -conf dosbox-x.conf

[sdl]
autolock=false

[dosbox]
machine=svga_s3
# memory snapshots (memdump.bin) will be written here:
captures=/Users/atiupin/Projects/kbr/dumps

[cpu]
core=normal
cputype=386
cycles=auto

[render]
scaler=normal2x

[autoexec]
mount c /Users/atiupin/Projects/kbr
path=c:\;c:\tools
c:
@echo ============================================================
@echo  King's Bounty (Russian translation project) mounted on C:
@echo    KB.EXE   - original packed game (launch via KB!)
@echo    KB_F.EXE - flat unpacked base, keep pristine (edit this)
@echo    KBR.EXE  - runnable build, protection patched (run this)
@echo  Test tips:   KBR            (run our working copy)
@echo               LOADFIX KBR    (run at a shifted address)
@echo ============================================================
