# DOSBox-X config for King's Bounty translation project
# Launch with:  /Applications/dosbox-x.app/Contents/MacOS/dosbox-x -conf dosbox-x.conf

[sdl]
autolock=false

[dosbox]
machine=svga_s3
# screenshots and memory snapshots (MEMDUMP.BIN) land here:
captures=/Users/atiupin/Projects/kbr/tmp

[cpu]
core=normal
cputype=386
cycles=auto

[render]
scaler=normal2x
aspect=true

[autoexec]
# One drive: C: is the run dir and holds nothing but the game -- KBR.EXE, the
# .CC archives and the saves. Nothing else needs mounting: the build is pure
# Python on the host, and LOADFIX is a DOSBox-X built-in.
mount c /Users/atiupin/Projects/kbr/build
path=c:\
c:
@echo ============================================================
@echo  King's Bounty (Russian translation project)
@echo    C:  build dir - KBR.EXE, 256.CC/416.CC, saves
@echo  Test tips:   KBR            (run our working copy)
@echo               LOADFIX KBR    (run at a shifted address)
@echo ============================================================
