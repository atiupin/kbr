name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one halfway: an interrupted run leaves the live
# site on the previous artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # What ships is the committed bundle/, so a rebuild from the same sources must
      # reproduce it byte for byte — a difference means someone changed web/, core/ or
      # res/ without rebuilding, and the page would go live stale.
      - run: npm run bundle && git diff --exit-code -- bundle/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: bundle
      - id: deploy
        uses: actions/deploy-pages@v4
